topic:
  background: "灾后临时安置点水电管理和环境监测面临人工巡检效率低、数据分散、异常响应滞后等问题。"
  problem_statement: "缺乏集环境监测、水电计量、智能预警与远程控制于一体的综合系统。"
  objectives:
    - "设计并实现一套面向安置点的智慧水电管理与环境监测一体化系统"
    - "实现六传感器数据采集、三级联动预警、水电剩余量模拟和双端上位机"
  significance:
    theoretical: "为物联网技术在应急管理领域的应用提供工程参考"
    practical: "提升安置点管理信息化水平，保障受灾群众基本生活安全"
  scope:
    included:
      - "STM32终端六传感器采集与执行器控制"
      - "ESP32边缘网关MQTT通信"
      - "Qt桌面端六大功能页面"
      - "Web看板三栏可视化界面"
      - "三级联动预警机制与组合告警"
      - "水电剩余量积分模拟"
    excluded:
      - "移动端App开发"
      - "多个安置点组网统一管理"
      - "传感器长期现场标定验证"
      - "Flash掉电保存"

